{% extends "base.html" %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}?v={{ range(1, 10000) | random }}" />
{% endblock %}
{% block content %}
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<div class="auth-container">
    <div style="margin-bottom: 20px;">
        <svg width="80" height="80" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303c-.792 2.237-2.231 4.166-4.087 5.571l6.193 5.236C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
    </div>
    <h2 class="font-outfit" style="margin-bottom:8px;">Welcome to MadeBy-Parrot</h2>
    <p style="color:var(--primary-light); margin-bottom:28px;">Sign in with Google to continue.</p>

    <button id="googleLoginBtn" class="google-login-btn" type="button">
        <span class="google-btn-content" id="googleBtnContent">
            <svg class="google-icon" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
                <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
                <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
                <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303c-.792 2.237-2.231 4.166-4.087 5.571l6.193 5.236C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
            </svg>
            <span>Continue with Google</span>
        </span>
    </button>
    <div id="loginError" class="login-error" role="alert"></div>
    <p class="gateway-note">Google is the only way to access MadeBy-Parrot.</p>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD538lgMjUEUXSbNFQuVgNphe0OVackYuk",
        authDomain: "madeby-parrot.firebaseapp.com",
        projectId: "madeby-parrot",
        storageBucket: "madeby-parrot.firebasestorage.app",
        messagingSenderId: "534763004343",
        appId: "1:534763004343:web:62e915fc8b6801e6568832",
        measurementId: "G-BYJ9NJSLXW"
    };
    firebase.initializeApp(firebaseConfig);

    const googleLoginBtn = document.getElementById('googleLoginBtn');
    const googleBtnContent = document.getElementById('googleBtnContent');
    const loginError = document.getElementById('loginError');

    function setLoading(loading) {
        googleLoginBtn.disabled = loading;
        if (loading) {
            googleBtnContent.innerHTML = `<span class="google-spinner"></span><span>Connecting...</span>`;
        } else {
            googleBtnContent.innerHTML = `<svg class="google-icon" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
                <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
                <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
                <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303c-.792 2.237-2.231 4.166-4.087 5.571l6.193 5.236C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
            </svg><span>Continue with Google</span>`;
        }
    }

    function showError(msg) { loginError.textContent = msg; loginError.style.display = 'block'; }
    function hideError() { loginError.textContent = ''; loginError.style.display = 'none'; }

    googleLoginBtn.addEventListener('click', async () => {
        hideError(); setLoading(true);
        try {
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });
            const result = await firebase.auth().signInWithPopup(provider);
            const idToken = await result.user.getIdToken();
            const response = await fetch('/auth/firebase', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idToken })
            });
            if (!response.ok) {
                const contentType = response.headers.get('content-type');
                if (contentType && contentType.includes('application/json')) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Authentication failed.');
                } else {
                    const errorText = await response.text();
                    console.error('Server returned HTML:', errorText);
                    throw new Error('Server error (500). Check Flask logs.');
                }
            }
            window.location.href = '/dashboard';
        } catch (error) {
            console.error(error);
            if (error.code === 'auth/popup-closed-by-user') showError('Google sign-in was cancelled.');
            else if (error.code === 'auth/popup-blocked') showError('Pop-up blocked. Allow pop-ups.');
            else showError(error.message || 'Something went wrong.');
        } finally { setLoading(false); }
    });
</script>
{% endblock %}
