{% extends "base.html" %}
{% block content %}
<div class="dashboard-container">
    <div class="dashboard-header">
        <h1 class="font-outfit">My Sites</h1>
        <form method="POST" action="{{ url_for('create_site') }}">
            <button type="submit" class="btn-primary"><span class="material-icons">add</span> Create New Site</button>
        </form>
    </div>
    
    <div class="site-grid">
        {% for site in sites %}
        <div class="site-card">
            <h3 class="font-outfit">{{ site.name }}</h3>
            <div class="site-status">
                <span class="status-badge {{ 'published' if site.published else 'draft' }}">
                    {{ 'Published' if site.published else 'Draft' }}
                </span>
            </div>
            <div class="site-actions">
                <a href="{{ url_for('builder', site_id=site.id) }}" class="btn-outline">Edit</a>
                {% if site.published %}
                    <a href="{{ url_for('view_site', slug=site.slug) }}" target="_blank" class="btn-primary">View Live</a>
                {% endif %}
                <form method="POST" action="{{ url_for('delete_site', site_id=site.id) }}" onsubmit="return confirm('Are you sure?');">
                    <button type="submit" class="btn-delete"><span class="material-icons">delete</span></button>
                </form>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
